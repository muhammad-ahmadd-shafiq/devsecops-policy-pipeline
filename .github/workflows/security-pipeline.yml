name: DevSecOps Policy Pipeline

run-name: "DevSecOps Policy Pipeline: ${{ github.event_name }} on ${{ github.ref_name }} (run #${{ github.run_number }})"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ===========================================================
  # Gate 0: Secret Detection
  # ===========================================================

  secrets:
    name: "Gate 0: Secret Detection"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan for secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"


  # ===========================================================
  # Gate 1: Source Code and Dependency Security
  # ===========================================================

  source-security:
    name: "Gate 1: Source and Dependencies"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run unit tests (pytest)
        run: python -m pytest -v

      - name: Run static analysis (Bandit)
        run: |
          python -m pip install bandit==1.8.6
          bandit -r app -ll

      - name: Audit Python dependencies (pip-audit)
        run: |
          python -m pip install pip-audit==2.9.0
          pip-audit -r requirements.txt


  # ===========================================================
  # Gate 2: Dockerfile Security
  # ===========================================================

  dockerfile-lint:
    name: "Gate 2: Dockerfile Lint"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Lint Dockerfile (Hadolint)
        run: |
          docker run --rm \
            -i hadolint/hadolint:v2.15.1 \
            hadolint --failure-threshold warning - < Dockerfile


  # ===========================================================
  # Gate 3: Container Image Security
  # ===========================================================

  container-security:
    name: "Gate 3: Container Image Security"
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build image
        run: |
          docker build \
            --tag devsecops-policy-pipeline:${{ github.sha }} \
            .

      - name: Scan image with Trivy (HIGH and CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          scan-ref: devsecops-policy-pipeline:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Generate Trivy SARIF report
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          scan-ref: devsecops-policy-pipeline:${{ github.sha }}
          scanners: vuln
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy SARIF to Code Scanning
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container


  # ===========================================================
  # Gate 4: Infrastructure as Code and Terraform Policies
  # ===========================================================

  terraform-security:
    name: "Gate 4: Infrastructure and Policy"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: |
          python -m pip install --upgrade pip
          python -m pip install checkov==3.4.0
          checkov --version

      - name: Install Conftest
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/open-policy-agent/conftest/releases/download/v0.71.1/conftest_0.71.1_Linux_x86_64.tar.gz \
            -o /tmp/conftest.tar.gz

          sudo tar -C /usr/local/bin -xzf /tmp/conftest.tar.gz conftest
          conftest --version

      - name: Checkov - Secure Terraform must pass
        run: |
          checkov \
            --directory terraform/secure \
            --framework terraform \
            --compact

      - name: Checkov - Insecure Terraform must be detected
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys

          command = [
              "checkov",
              "--directory", "terraform/insecure",
              "--framework", "terraform",
              "--output", "json",
          ]

          result = subprocess.run(
              command,
              capture_output=True,
              text=True,
          )

          try:
              report = json.loads(result.stdout)
          except json.JSONDecodeError:
              print("ERROR: Could not parse Checkov JSON output.")
              print(result.stdout)
              print(result.stderr)
              sys.exit(1)

          failed_checks = report.get("results", {}).get("failed_checks", [])

          if result.returncode == 0 or not failed_checks:
              print("ERROR: Checkov did not detect the expected insecure configuration.")
              sys.exit(1)

          print(
              f"PASS: Checkov detected {len(failed_checks)} "
              "insecure Terraform configuration(s)."
          )
          PY

      - name: Conftest - Verify Rego policy tests
        run: |
          conftest verify \
            --policy policies/conftest/terraform

      - name: Conftest - Secure Terraform must pass
        run: |
          conftest test \
            --policy policies/conftest/terraform \
            --parser hcl2 \
            terraform/secure

      - name: Conftest - Insecure Terraform must be detected
        run: |
          python - <<'PY'
          import subprocess
          import sys

          command = [
              "conftest", "test",
              "--policy", "policies/conftest/terraform",
              "--parser", "hcl2",
              "terraform/insecure",
          ]

          result = subprocess.run(
              command,
              capture_output=True,
              text=True,
          )

          output = result.stdout + result.stderr

          expected_violations = [
              "must encrypt every root EBS volume",
              "must not have a public IP address",
              "must not expose SSH to 0.0.0.0/0",
          ]

          missing = [
              violation
              for violation in expected_violations
              if violation not in output
          ]

          if result.returncode == 0:
              print("ERROR: Conftest unexpectedly allowed insecure Terraform.")
              print(output)
              sys.exit(1)

          if missing:
              print("ERROR: Conftest did not report every expected violation:")
              for violation in missing:
                  print(f"- {violation}")
              print(output)
              sys.exit(1)

          print("PASS: Conftest detected all three expected Terraform policy violations.")
          PY


  # ===========================================================
  # Gate 5: Kubernetes Policy Enforcement (Conftest)
  # ===========================================================

  kubernetes-security:
    name: "Gate 5: Kubernetes Policy Enforcement"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Conftest
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/open-policy-agent/conftest/releases/download/v0.71.1/conftest_0.71.1_Linux_x86_64.tar.gz \
            -o /tmp/conftest.tar.gz

          sudo tar -C /usr/local/bin -xzf /tmp/conftest.tar.gz conftest
          conftest --version

      - name: Verify Kubernetes Rego policies
        run: |
          conftest verify \
            --policy policies/conftest/kubernetes

      - name: Validate secure Kubernetes manifests
        run: |
          conftest test \
            --policy policies/conftest/kubernetes \
            k8s/deployment.yaml

      - name: Verify detection of insecure Kubernetes manifests
        run: |
          python - <<'PY'
          import subprocess
          import sys

          command = [
              "conftest", "test",
              "--policy", "policies/conftest/kubernetes",
              "k8s/bad-deployments",
          ]

          result = subprocess.run(
              command,
              capture_output=True,
              text=True,
          )

          output = result.stdout + result.stderr

          expected_violations = [
              "must explicitly run as non-root",
              "must not run with user ID 0",
              "must not run as privileged",
              "must define CPU requests",
              "must define memory requests",
              "must define CPU limits",
              "must define memory limits",
              "must not use the latest image tag",
              "must disable automatic ServiceAccount token mounting",
          ]

          if result.returncode == 0:
              print("ERROR: Insecure Kubernetes manifest unexpectedly passed.")
              print(output)
              sys.exit(1)

          missing = [
              violation
              for violation in expected_violations
              if violation not in output
          ]

          if missing:
              print("ERROR: Expected policy violations were not detected:")
              for violation in missing:
                  print(f"- {violation}")
              print(output)
              sys.exit(1)

          print("PASS: All expected Kubernetes policy violations were detected.")
          PY


  # ===========================================================
  # Gate 6: Kyverno Admission Policy Testing
  # ===========================================================

  kyverno-policy-tests:
    name: "Gate 6: Kyverno Policy Tests"
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Kyverno CLI
        uses: kyverno/action-install-cli@v0.2.0
        with:
          release: v1.19.2

      - name: Check Kyverno CLI version
        run: kyverno version

      - name: Test secure Kubernetes workload
        run: |
          kyverno apply \
            policies/kyverno/admission/secure-workload-policy.yaml \
            --resource k8s/deployment.yaml

      - name: Verify rejection of insecure Kubernetes workload
        run: |
          python - <<'PY'
          import subprocess
          import sys

          command = [
              "kyverno",
              "apply",
              "policies/kyverno/admission/secure-workload-policy.yaml",
              "--resource",
              "k8s/kyverno/insecure-deployment.yaml",
          ]

          result = subprocess.run(
              command,
              capture_output=True,
              text=True,
          )

          output = result.stdout + result.stderr

          if result.returncode == 0:
              print("ERROR: Kyverno unexpectedly accepted the insecure workload.")
              print(output)
              sys.exit(1)

          print("PASS: Kyverno rejected the insecure workload as expected.")
          print(output)
          PY


  # ===========================================================
  # Gate 7: Software Supply-Chain Security
  # ===========================================================

  supply-chain-security:
    name: "Gate 7: Software Supply-Chain Security"

    # All security gates must pass before publishing.
    needs:
      - secrets
      - source-security
      - dockerfile-lint
      - container-security
      - terraform-security
      - kubernetes-security
      - kyverno-policy-tests

    # Publish only from main.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    env:
      IMAGE_NAME: ghcr.io/muhammad-ahmadd-shafiq/devsecops-policy-pipeline

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # -------------------------------------------------------
      # 1. Install Cosign
      # -------------------------------------------------------

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0
        with:
          cosign-release: v3.1.3

      - name: Verify Cosign installation
        run: cosign version

      # -------------------------------------------------------
      # 2. Configure Docker Buildx
      # -------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      # -------------------------------------------------------
      # 3. Authenticate with GHCR
      # -------------------------------------------------------

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------
      # 4. Build and publish image
      # -------------------------------------------------------

      - name: Build and push container image
        id: build
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          push: true

          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=devsecops-policy-pipeline

          # Generate detailed BuildKit provenance.
          provenance: mode=max

      # -------------------------------------------------------
      # 5. Scan published image by immutable digest
      # -------------------------------------------------------

      - name: Scan published image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          scan-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # -------------------------------------------------------
      # 6. Generate SBOM for exact published image digest
      # -------------------------------------------------------

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      # -------------------------------------------------------
      # 7. Validate SBOM
      # -------------------------------------------------------

      - name: Validate SBOM structure
        run: |
          python scripts/validate_sbom.py sbom.cdx.json

      # -------------------------------------------------------
      # 8. Upload SBOM as workflow artifact
      # -------------------------------------------------------

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

      # -------------------------------------------------------
      # 9. Sign image using Cosign keyless signing
      # -------------------------------------------------------

      - name: Sign container image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE_NAME}@${IMAGE_DIGEST}"

      # -------------------------------------------------------
      # 10. Verify image signature
      # -------------------------------------------------------

      - name: Verify container image signature
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/security-pipeline.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE_NAME}@${IMAGE_DIGEST}"

      # -------------------------------------------------------
      # 11. Create Cosign SBOM attestation
      # -------------------------------------------------------

      - name: Create SBOM attestation
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign attest \
            --yes \
            --type cyclonedx \
            --predicate sbom.cdx.json \
            "${IMAGE_NAME}@${IMAGE_DIGEST}"

      # -------------------------------------------------------
      # 12. Verify Cosign SBOM attestation
      # -------------------------------------------------------

      - name: Verify SBOM attestation
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify-attestation \
            --type cyclonedx \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/security-pipeline.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE_NAME}@${IMAGE_DIGEST}"

      # -------------------------------------------------------
      # 13. Generate signed GitHub build provenance
      # -------------------------------------------------------

      - name: Generate SLSA build provenance attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # -------------------------------------------------------
      # 14. Verify build provenance
      # -------------------------------------------------------

      - name: Verify SLSA build provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Verifying image build provenance..."

          gh attestation verify \
            "oci://${IMAGE_NAME}@${IMAGE_DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "github.com/${GITHUB_REPOSITORY}/.github/workflows/security-pipeline.yml" \
            --source-ref "refs/heads/main"

          echo "Build provenance verification successful."

      # -------------------------------------------------------
      # 15. Print published artifact information
      # -------------------------------------------------------

      - name: Display supply-chain artifact information
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "=========================================="
          echo "SUPPLY-CHAIN SECURITY SUMMARY"
          echo "=========================================="
          echo "Image: ${IMAGE_NAME}"
          echo "Digest: ${IMAGE_DIGEST}"
          echo "SBOM: sbom.cdx.json"
          echo "Image signature: Verified"
          echo "SBOM attestation: Verified"
          echo "Build provenance: Verified"
          echo "=========================================="
