
name: DevSecOps Policy Pipeline

run-name: "DevSecOps Policy Pipeline: ${{ github.event_name }} on ${{ github.ref_name }} (run #${{ github.run_number }})"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ===========================================================
  # Gate 0: Secret detection
  # ===========================================================
  secrets:
    name: "Gate 0: Secret detection"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan for secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  # ===========================================================
  # Gate 1: Source code and dependencies
  # ===========================================================
  source-security:
    name: "Gate 1: Source and dependencies"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run unit tests (pytest)
        run: python -m pytest -v

      - name: Run static analysis (Bandit)
        run: |
          python -m pip install bandit==1.8.6
          bandit -r app -ll

      - name: Audit Python dependencies (pip-audit)
        run: |
          python -m pip install pip-audit==2.9.0
          pip-audit -r requirements.txt

  # ===========================================================
  # Gate 2: Dockerfile
  # ===========================================================
  dockerfile-lint:
    name: "Gate 2: Dockerfile lint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Lint Dockerfile (Hadolint)
        run: |
          docker run --rm \
            -i hadolint/hadolint:v2.15.1 \
            hadolint --failure-threshold warning - < Dockerfile

  # ===========================================================
  # Gate 3: Container image
  # ===========================================================
  container-security:
    name: "Gate 3: Container image"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build image
        run: |
          docker build \
            --tag devsecops-policy-pipeline:${{ github.sha }} \
            .

      - name: Scan image with Trivy (fail on HIGH and CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          scan-ref: devsecops-policy-pipeline:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Generate Trivy SARIF report
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          scan-ref: devsecops-policy-pipeline:${{ github.sha }}
          scanners: vuln
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy SARIF to Code Scanning
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container

  # ===========================================================
  # Gate 4: Infrastructure as Code and policy
  # ===========================================================
  terraform-security:
    name: "Gate 4: Infrastructure and policy"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: |
          python -m pip install --upgrade pip
          python -m pip install checkov==3.4.0
          checkov --version

      - name: Install Conftest
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/open-policy-agent/conftest/releases/download/v0.71.1/conftest_0.71.1_Linux_x86_64.tar.gz \
            -o /tmp/conftest.tar.gz

          sudo tar -C /usr/local/bin -xzf /tmp/conftest.tar.gz conftest
          conftest --version

      # Checkov: secure Terraform must pass.
      - name: "Checkov: secure Terraform must pass"
        run: |
          checkov \
            --directory terraform/secure \
            --framework terraform \
            --compact

      # Checkov: insecure Terraform must produce findings.
      # These failures are expected because this is a negative test fixture.
      - name: "Checkov: insecure Terraform must be detected"
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys

          command = [
              "checkov",
              "--directory", "terraform/insecure",
              "--framework", "terraform",
              "--output", "json",
          ]

          result = subprocess.run(
              command,
              capture_output=True,
              text=True,
          )

          try:
              report = json.loads(result.stdout)
          except json.JSONDecodeError:
              print("ERROR: Could not parse Checkov JSON output.")
              print(result.stdout)
              print(result.stderr)
              sys.exit(1)

          failed_checks = report.get("results", {}).get("failed_checks", [])

          if result.returncode == 0 or not failed_checks:
              print("ERROR: Checkov did not detect the expected insecure configuration.")
              sys.exit(1)

          print(f"PASS: Checkov detected {len(failed_checks)} insecure Terraform configuration(s).")
          PY

      # Conftest: validate the Rego policy unit tests.
      - name: "Conftest: verify Rego policy tests"
        run: |
          conftest verify \
            --policy policies/conftest/terraform

      # Conftest: secure Terraform must pass every policy.
      - name: "Conftest: secure Terraform must pass"
        run: |
          conftest test \
            --policy policies/conftest/terraform \
            --parser hcl2 \
            terraform/secure

      # Conftest: insecure Terraform must trigger all three custom rules.
      - name: "Conftest: insecure Terraform must be detected"
        run: |
          python - <<'PY'
          import subprocess
          import sys

          command = [
              "conftest", "test",
              "--policy", "policies/conftest/terraform",
              "--parser", "hcl2",
              "terraform/insecure",
          ]

          result = subprocess.run(
              command,
              capture_output=True,
              text=True,
          )

          output = result.stdout + result.stderr

          expected_violations = [
              "must encrypt every root EBS volume",
              "must not have a public IP address",
              "must not expose SSH to 0.0.0.0/0",
          ]

          missing = [
              violation
              for violation in expected_violations
              if violation not in output
          ]

          if result.returncode == 0:
              print("ERROR: Conftest unexpectedly allowed insecure Terraform.")
              print(output)
              sys.exit(1)

          if missing:
              print("ERROR: Conftest did not report every expected violation:")
              for violation in missing:
                  print(f"- {violation}")
              print(output)
              sys.exit(1)

          print("PASS: Conftest detected all three expected Terraform policy violations.")
          PY

  # ===========================================================
  # Gate 5: Kubernetes policy enforcement
  # ===========================================================
  kubernetes-security:
    name: "Gate 5: Kubernetes policy enforcement"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Conftest
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/open-policy-agent/conftest/releases/download/v0.71.1/conftest_0.71.1_Linux_x86_64.tar.gz \
            -o /tmp/conftest.tar.gz

          sudo tar -C /usr/local/bin -xzf /tmp/conftest.tar.gz conftest

          conftest --version

      # Verify the custom Kubernetes Rego unit tests.
      - name: Verify Kubernetes Rego policies
        run: |
          conftest verify \
            --policy policies/conftest/kubernetes

      # The real application Deployment must pass.
      - name: Validate secure Kubernetes manifests
        run: |
          conftest test \
            --policy policies/conftest/kubernetes \
            k8s/deployment.yaml

      # The insecure fixture must fail with all expected violations.
      # Python interprets the expected nonzero exit code as a successful negative test.
      - name: Verify detection of insecure Kubernetes manifests
        run: |
          python - <<'PY'
          import subprocess
          import sys

          command = [
              "conftest", "test",
              "--policy", "policies/conftest/kubernetes",
              "k8s/bad-deployments",
          ]

          result = subprocess.run(
              command,
              capture_output=True,
              text=True,
          )

          output = result.stdout + result.stderr

          expected_violations = [
              "must explicitly run as non-root",
              "must not run with user ID 0",
              "must not run as privileged",
              "must define CPU requests",
              "must define memory requests",
              "must define CPU limits",
              "must define memory limits",
              "must not use the latest image tag",
              "must disable automatic ServiceAccount token mounting",
          ]

          if result.returncode == 0:
              print("ERROR: Insecure Kubernetes manifest unexpectedly passed.")
              print(output)
              sys.exit(1)

          missing = [
              violation
              for violation in expected_violations
              if violation not in output
          ]

          if missing:
              print("ERROR: Expected policy violations were not detected:")
              for violation in missing:
                  print(f"- {violation}")
              print(output)
              sys.exit(1)

          print("PASS: All expected Kubernetes policy violations were detected.")
          PY

  # ===========================================================
  # Gate 6: Software supply-chain security
  # ===========================================================
  supply-chain-security:
    name: "Gate 6: Software supply-chain security"

    # Publish only after every security gate succeeds.
    needs:
      - secrets
      - source-security
      - dockerfile-lint
      - container-security
      - terraform-security
      - kubernetes-security

    # Do not publish images from pull requests.
    # Allow main-branch pushes and manual runs on main.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    env:
      IMAGE_NAME: ghcr.io/muhammad-ahmadd-shafiq/devsecops-policy-pipeline

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0
        with:
          cosign-release: v3.1.3

      - name: Check Cosign installation
        run: cosign version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push an immutable commit-tagged image.
      - name: Build and push container image
        id: build
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=devsecops-policy-pipeline

      # Scan the exact published digest before signing or attesting it.
      - name: Scan published image digest with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          scan-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # Generate a CycloneDX SBOM from the published image.
      - name: Generate container SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      # Upload the SBOM as a downloadable workflow artifact.
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

      # Sign the immutable image digest using GitHub OIDC.
      - name: Sign container image with Cosign
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE_NAME}@${IMAGE_DIGEST}"

      # Verify that the signature belongs to this workflow.
      - name: Verify container image signature
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/security-pipeline.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE_NAME}@${IMAGE_DIGEST}"

      # Attach the SBOM to the exact image digest as an attestation.
      - name: Create SBOM attestation
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign attest \
            --yes \
            --type cyclonedx \
            --predicate sbom.cdx.json \
            "${IMAGE_NAME}@${IMAGE_DIGEST}"

      # Verify the attestation's signature and identity.
      - name: Verify SBOM attestation
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Starting SBOM attestation verification..."

          timeout --signal=TERM --kill-after=10s 3m \
            cosign --verbose --timeout 2m verify-attestation \
              --type cyclonedx \
              --output text \
              --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/security-pipeline.yml@refs/heads/main" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${IMAGE_NAME}@${IMAGE_DIGEST}"

          echo "SBOM attestation successfully verified."