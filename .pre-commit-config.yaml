repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: Scan staged changes for secrets
        entry: gitleaks protect --staged --redact --verbose
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: hadolint
        name: Lint Dockerfile
        entry: hadolint
        language: system
        files: ^Dockerfile$
        stages: [pre-commit]