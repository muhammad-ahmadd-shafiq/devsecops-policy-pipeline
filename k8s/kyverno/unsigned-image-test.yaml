
apiVersion: apps/v1
kind: Deployment

metadata:
  name: unsigned-image-test
  namespace: default
  labels:
    app: unsigned-image-test

spec:
  replicas: 1

  selector:
    matchLabels:
      app: unsigned-image-test

  template:
    metadata:
      labels:
        app: unsigned-image-test

    spec:
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: unsigned-test

          image: ghcr.io/muhammad-ahmadd-shafiq/devsecops-policy-pipeline:unsigned-test-20261106

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
