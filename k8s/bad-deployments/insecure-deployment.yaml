
apiVersion: apps/v1
kind: Deployment
metadata:
  name: insecure-app
  labels:
    app: insecure-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insecure-app
  template:
    metadata:
      labels:
        app: insecure-app
    spec:
      automountServiceAccountToken: true

      securityContext:
        runAsNonRoot: false
        runAsUser: 0

      containers:
        - name: app
          image: nginx:latest

          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
