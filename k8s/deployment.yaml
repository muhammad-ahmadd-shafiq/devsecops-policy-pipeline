apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-pipeline
  labels:
    app: policy-pipeline
spec:
  replicas: 2
  selector:
    matchLabels:
      app: policy-pipeline
  template:
    metadata:
      labels:
        app: policy-pipeline
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: devsecops-policy-pipeline:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: policy-pipeline
spec:
  type: ClusterIP
  selector:
    app: policy-pipeline
  ports:
    - name: http
      port: 80
      targetPort: http