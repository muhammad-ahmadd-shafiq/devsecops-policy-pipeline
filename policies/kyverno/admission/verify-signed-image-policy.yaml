
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy

metadata:
  name: verify-devsecops-pipeline-images

spec:
  failurePolicy: Fail

  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods

      - apiGroups:
          - apps
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - deployments
          - statefulsets
          - daemonsets
          - replicasets

      - apiGroups:
          - batch
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - jobs
          - cronjobs

  matchImageReferences:
    - glob: ghcr.io/muhammad-ahmadd-shafiq/devsecops-policy-pipeline*

  attestors:
    - name: githubActions
      cosign:
        ctlog:
          url: https://rekor.sigstore.dev
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subject: https://github.com/muhammad-ahmadd-shafiq/devsecops-policy-pipeline/.github/workflows/security-pipeline.yml@refs/heads/main

  attestations:
    - name: sbom
      intoto:
        type: https://cyclonedx.org/bom

  validationActions:
    - Deny

  validationConfigurations:
    mutateDigest: true
    required: true
    verifyDigest: true

  validations:
    - expression: |
        images.containers.map(
          image,
          verifyImageSignatures(image, [attestors.githubActions])
        ).all(result, result > 0)
      message: >-
        Container image must have a valid Cosign keyless signature
        from the approved GitHub Actions workflow.

    - expression: |
        images.containers.map(
          image,
          verifyAttestationSignatures(
            image,
            attestations.sbom,
            [attestors.githubActions]
          )
        ).all(result, result > 0)
      message: >-
        Container image must have a valid CycloneDX SBOM attestation
        signed by the approved GitHub Actions workflow.

    - expression: |
        images.containers.map(
          image,
          extractPayload(image, attestations.sbom).predicate.bomFormat
            == 'CycloneDX'
        ).all(result, result)
      message: >-
        The verified SBOM attestation must contain a CycloneDX predicate.

  webhookConfiguration:
    timeoutSeconds: 30
